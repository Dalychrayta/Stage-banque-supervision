server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Le build Angular (mode SSR/pré-rendu) produit deux sortes de pages :
    #  - index.csr.html  : la coquille de l'application (à la racine)
    #  - <route>/index.html : les pages pré-rendues (dashboard/, anomalies/...)
    # Les deux noms sont donc déclarés, dans cet ordre : sinon nginx sert sa
    # propre page d'accueil à la racine, ou renvoie 403 sur les sous-dossiers.
    index index.csr.html index.html;

    location / {
        # Routes Angular (/anomalies, /healing...) : aucun fichier ne
        # porte ce nom sur le disque, on renvoie donc l'application qui
        # affichera la bonne page côté navigateur.
        try_files $uri $uri/ /index.csr.html;
    }
}
