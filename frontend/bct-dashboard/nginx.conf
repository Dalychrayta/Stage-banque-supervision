server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Routes Angular (/anomalies, /healing...) : aucun fichier ne porte
        # ce nom sur le disque, on renvoie donc l'application qui affichera
        # la bonne page côté navigateur.
        try_files $uri $uri/ /index.html;
    }
}
