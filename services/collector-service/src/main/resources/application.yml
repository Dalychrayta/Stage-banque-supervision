server:
  port: 8082

spring:
  application:
    name: collector-service
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:localhost}:1521/XEPDB1
    username: ${COLLECTOR_DB_USER:collector_user}
    password: ${COLLECTOR_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: collector-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer enveloppe le lecteur JSON : un message
      # illisible est signale et ECARTE, au lieu de bloquer le consommateur.
      # Sans lui, un seul message malforme arretait definitivement ce service —
      # il le relisait, echouait, recommencait, en silence. Constate en vrai.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        # On n'exige plus l'en-tete de type ajoute par un producteur Spring :
        # tout message JSON est lu comme une Map, ce qu'attend deja le code.
        # La plateforme accepte donc n'importe quel producteur, pas seulement
        # un service Spring.
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Topics Kafka
kafka:
  topics:
    metrics-collected: metrics-collected
    logs-collected: logs-collected
    resource-discovered: resource-discovered

# Prediction Engine URL
prediction:
  engine:
    url: ${PREDICTION_ENGINE_URL:http://localhost:8000}

# Discovery Service URL
discovery:
  service:
    url: ${DISCOVERY_SERVICE_URL:http://localhost:8081}

# Intervalle de collecte (ms)
collector:
  metrics:
    interval-ms: 30000
  logs:
    interval-ms: 60000

# Cible réelle surveillée (srv-002).
# warmup-seconds : durée après un démarrage pendant laquelle les mesures sont
# conservées mais PAS analysées. Une JVM qui démarre consomme presque tout le
# CPU pendant quelques secondes ; prise pour une panne, elle déclenchait un
# redémarrage, donc un nouveau démarrage, donc une nouvelle alerte — en boucle.
real-target:
  actuator-url: ${REAL_TARGET_ACTUATOR_URL:http://localhost:8085/actuator}
  warmup-seconds: ${REAL_TARGET_WARMUP_SECONDS:120}
