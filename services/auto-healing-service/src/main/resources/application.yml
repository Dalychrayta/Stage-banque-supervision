server:
  port: 8084

spring:
  application:
    name: auto-healing-service
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:localhost}:1521/XEPDB1
    username: ${HEALING_DB_USER:healing_user}
    password: ${HEALING_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  # Vérification des jetons Keycloak par ce service lui-même.
  # issuer-uri : l'adresse telle que le NAVIGATEUR la connaît, celle inscrite
  # dans le jeton — c'est elle qui doit correspondre, sinon le jeton est rejeté.
  # jwk-set-uri : l'adresse par laquelle CE CONTENEUR joint Keycloak pour
  # récupérer les clés de signature. Les deux diffèrent en local, et se
  # confondent en production derrière un vrai nom de domaine.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bct}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/bct/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: healing-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer enveloppe le lecteur JSON : un message
      # illisible est signale et ECARTE, au lieu de bloquer le consommateur.
      # Sans lui, un seul message malforme arretait definitivement ce service —
      # il le relisait, echouait, recommencait, en silence. Constate en vrai.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        # On n'exige plus l'en-tete de type ajoute par un producteur Spring :
        # tout message JSON est lu comme une Map, ce qu'attend deja le code.
        # La plateforme accepte donc n'importe quel producteur, pas seulement
        # un service Spring.
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# Topics Kafka
kafka:
  topics:
    rca-result: rca-result
    healing-action: healing-action
    anomaly-detected: anomaly-detected

# RCA Service URL
rca:
  service:
    url: ${RCA_SERVICE_URL:http://localhost:8083}

# Cible réelle (srv-002 = PlatformeBack). Ces trois valeurs délimitent
# TOUT ce que l'auto-remédiation a le droit de toucher : un seul conteneur
# à redémarrer, un seul dossier où supprimer des logs, et l'âge minimum
# d'une archive supprimable.
# Garde-fou anti-battement : délai minimum avant de rejouer la MÊME action
# automatique sur la MÊME ressource. Sans lui, un redémarrage provoque un pic
# de CPU au démarrage de la JVM, que la plateforme interprète comme une
# saturation, et qu'elle « soigne » par un nouveau redémarrage — en boucle.
# Ne s'applique pas aux actions déclenchées par un humain.
healing:
  cooldown-minutes: ${HEALING_COOLDOWN_MINUTES:10}

real-target:
  container: ${REAL_TARGET_CONTAINER:bct-platformeback}
  log-dir: ${REAL_TARGET_LOG_DIR:/target-logs}
  log-retention-days: ${REAL_TARGET_LOG_RETENTION_DAYS:7}
