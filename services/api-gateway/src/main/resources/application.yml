server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: discovery-service
          uri: lb://discovery-service
          predicates:
            - Path=/api/discovery/**
          filters:
            - RewritePath=/api/discovery/(?<remaining>.*), /api/${remaining}

        - id: collector-service
          uri: lb://collector-service
          predicates:
            - Path=/api/collector/**

        - id: prediction-engine
          uri: lb://prediction-engine
          predicates:
            - Path=/api/prediction/**

        - id: rca-service
          uri: lb://rca-service
          predicates:
            - Path=/api/rca/**

        - id: auto-healing-service
          uri: lb://auto-healing-service
          predicates:
            - Path=/api/healing/**

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak (realm bct). L'URL doit être joignable par ce service ET
          # identique à l'émetteur (iss) des jetons — d'où host.docker.internal
          # aussi bien pour le navigateur que pour les conteneurs.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bct}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
