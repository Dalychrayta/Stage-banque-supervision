global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Mode Docker complet : les services BCT tournent comme conteneurs sur le
  # même réseau que Prometheus, donc on les atteint par leur nom de service
  # (défini dans docker-compose.yml), pas par host.docker.internal.
  - job_name: bct-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - discovery-service:8081
          - collector-service:8082
          - rca-service:8083
          - auto-healing-service:8084

  # Cible réelle (PlatformeBack, ancien projet relancé comme serveur de test réel)
  - job_name: real-target
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8085
