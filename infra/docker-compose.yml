services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: bct-oracle
    environment:
      # Mot de passe SYS/SYSTEM — ne compte que pour une toute première
      # initialisation du volume ; sur une base déjà existante (notre cas),
      # le mot de passe réel a été changé à la main (ALTER USER).
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 20

  # Kafka en mode KRaft : plus besoin de Zookeeper à côté (supprimé), Kafka
  # gère lui-même sa coordination interne depuis la version 7.x de Confluent.
  # Un conteneur en moins, et surtout : élimine le blocage rencontré plusieurs
  # fois en pratique (Zookeeper gardant une inscription périmée d'un ancien
  # Kafka après un arrêt brutal, empêchant Kafka de redémarrer tant qu'on ne
  # redémarrait pas Zookeeper d'abord).
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: bct-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "cT4XFJyZS4mFSVXkCgqRaA"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx400m -Xms400m"
    mem_limit: 700m
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: bct-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 300m

  loki:
    image: grafana/loki:3.1.1
    container_name: bct-loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
    mem_limit: 300m

  grafana:
    image: grafana/grafana:11.1.0
    container_name: bct-grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    mem_limit: 300m

  eureka-server:
    build: ../services/eureka-server
    image: ghcr.io/dalychrayta/bct-eureka-server:latest
    container_name: bct-eureka-server
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx200m"
    mem_limit: 350m
    ports:
      - "8761:8761"

  api-gateway:
    build: ../services/api-gateway
    image: ghcr.io/dalychrayta/bct-api-gateway:latest
    container_name: bct-api-gateway
    depends_on:
      - eureka-server
    environment:
      EUREKA_HOST: eureka-server
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-Xmx250m"
    mem_limit: 400m
    ports:
      - "8080:8080"

  discovery-service:
    build: ../services/discovery-service
    image: ghcr.io/dalychrayta/bct-discovery-service:latest
    container_name: bct-discovery-service
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      ORACLE_HOST: oracle
      DISCOVERY_DB_PASSWORD: ${DISCOVERY_DB_PASSWORD}
      EUREKA_HOST: eureka-server
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xmx250m"
    mem_limit: 400m
    ports:
      - "8081:8081"

  collector-service:
    build: ../services/collector-service
    image: ghcr.io/dalychrayta/bct-collector-service:latest
    container_name: bct-collector-service
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
      discovery-service:
        condition: service_started
      prediction-engine:
        condition: service_started
    environment:
      ORACLE_HOST: oracle
      COLLECTOR_DB_PASSWORD: ${COLLECTOR_DB_PASSWORD}
      EUREKA_HOST: eureka-server
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PREDICTION_ENGINE_URL: http://prediction-engine:8000
      DISCOVERY_SERVICE_URL: http://discovery-service:8081
      JAVA_TOOL_OPTIONS: "-Xmx250m"
    mem_limit: 400m
    ports:
      - "8082:8082"

  rca-service:
    build: ../services/rca-service
    image: ghcr.io/dalychrayta/bct-rca-service:latest
    container_name: bct-rca-service
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      ORACLE_HOST: oracle
      RCA_DB_PASSWORD: ${RCA_DB_PASSWORD}
      EUREKA_HOST: eureka-server
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xmx250m"
    mem_limit: 400m
    ports:
      - "8083:8083"

  auto-healing-service:
    build: ../services/auto-healing-service
    image: ghcr.io/dalychrayta/bct-auto-healing-service:latest
    container_name: bct-auto-healing-service
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      ORACLE_HOST: oracle
      HEALING_DB_PASSWORD: ${HEALING_DB_PASSWORD}
      EUREKA_HOST: eureka-server
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xmx250m"
    mem_limit: 400m
    ports:
      - "8084:8084"

  prediction-engine:
    build: ../services/prediction-engine
    image: ghcr.io/dalychrayta/bct-prediction-engine:latest
    container_name: bct-prediction-engine
    mem_limit: 400m
    ports:
      - "8000:8000"

  frontend:
    build: ../frontend/bct-dashboard
    image: ghcr.io/dalychrayta/bct-frontend:latest
    container_name: bct-frontend
    depends_on:
      - api-gateway
    mem_limit: 100m
    ports:
      - "4200:80"

volumes:
  oracle-data:
  grafana-data:
