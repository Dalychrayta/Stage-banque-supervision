services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: bct-oracle
    environment:
      # Mot de passe SYS/SYSTEM — ne compte que pour une toute première
      # initialisation du volume ; sur une base déjà existante (notre cas),
      # le mot de passe réel a été changé à la main (ALTER USER).
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 20

  # Kafka en mode KRaft : plus besoin de Zookeeper à côté (supprimé), Kafka
  # gère lui-même sa coordination interne depuis la version 7.x de Confluent.
  # Un conteneur en moins, et surtout : élimine le blocage rencontré plusieurs
  # fois en pratique (Zookeeper gardant une inscription périmée d'un ancien
  # Kafka après un arrêt brutal, empêchant Kafka de redémarrer tant qu'on ne
  # redémarrait pas Zookeeper d'abord).
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: bct-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "cT4XFJyZS4mFSVXkCgqRaA"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx400m -Xms400m"
    mem_limit: 700m
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: bct-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 300m

  loki:
    image: grafana/loki:3.1.1
    container_name: bct-loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
    mem_limit: 300m

  grafana:
    image: grafana/grafana:11.1.0
    container_name: bct-grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    mem_limit: 300m

  eureka-server:
    build: ../services/eureka-server
    image: ghcr.io/dalychrayta/bct-eureka-server:latest
    container_name: bct-eureka-server
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx200m"
    mem_limit: 350m
    ports:
      - "8761:8761"

  # Gestion d'identité : comptes, rôles (VIEWER/OPERATOR/ADMIN), connexion,
  # émission des jetons. Mode "dev" = base H2 intégrée (persistée dans le
  # volume keycloak-data). Le realm "bct" est importé au démarrage.
  #
  # KC_HOSTNAME = l'adresse vue par le NAVIGATEUR (hors Docker), c'est elle
  # qui devient l'émetteur (iss) des jetons.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: bct-keycloak
    command: start-dev --import-realm --http-port=8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-bct.json:/opt/keycloak/data/import/realm-bct.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "8180:8180"
    mem_limit: 768m

  api-gateway:
    build: ../services/api-gateway
    image: ghcr.io/dalychrayta/bct-api-gateway:latest
    container_name: bct-api-gateway
    depends_on:
      - eureka-server
      - keycloak
    environment:
      EUREKA_HOST: eureka-server
      # Le navigateur est hors Docker, ce service est dedans : ils ne voient
      # pas Keycloak à la même adresse. On sépare donc les deux usages —
      #   ISSUER : l'émetteur annoncé dans le jeton, qu'on vérifie (adresse navigateur)
      #   JWKS   : où récupérer les clés de signature (réseau interne Docker)
      # En production, Keycloak a un seul nom public joignable par tous :
      # les deux variables pointent alors vers la même URL.
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/bct
      KEYCLOAK_JWKS_URI: http://keycloak:8180/realms/bct/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: "-Xmx250m"
    mem_limit: 400m
    ports:
      - "8080:8080"

  discovery-service:
    build: ../services/discovery-service
    image: ghcr.io/dalychrayta/bct-discovery-service:latest
    container_name: bct-discovery-service
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      ORACLE_HOST: oracle
      DISCOVERY_DB_PASSWORD: ${DISCOVERY_DB_PASSWORD}
      EUREKA_HOST: eureka-server
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xmx250m"
    mem_limit: 400m
    ports:
      - "8081:8081"

  collector-service:
    build: ../services/collector-service
    image: ghcr.io/dalychrayta/bct-collector-service:latest
    container_name: bct-collector-service
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
      discovery-service:
        condition: service_started
      prediction-engine:
        condition: service_started
    environment:
      ORACLE_HOST: oracle
      COLLECTOR_DB_PASSWORD: ${COLLECTOR_DB_PASSWORD}
      EUREKA_HOST: eureka-server
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PREDICTION_ENGINE_URL: http://prediction-engine:8000
      DISCOVERY_SERVICE_URL: http://discovery-service:8081
      # Cible réelle surveillée (srv-002). Pas de depends_on volontairement :
      # le collecteur doit continuer à tourner — et à signaler l'indisponibilité —
      # quand la cible est arrêtée, c'est justement ce qu'il sert à détecter.
      REAL_TARGET_ACTUATOR_URL: http://platformeback:8085/actuator
      JAVA_TOOL_OPTIONS: "-Xmx250m"
    mem_limit: 400m
    ports:
      - "8082:8082"

  rca-service:
    build: ../services/rca-service
    image: ghcr.io/dalychrayta/bct-rca-service:latest
    container_name: bct-rca-service
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      ORACLE_HOST: oracle
      RCA_DB_PASSWORD: ${RCA_DB_PASSWORD}
      EUREKA_HOST: eureka-server
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: "-Xmx250m"
    mem_limit: 400m
    ports:
      - "8083:8083"

  auto-healing-service:
    build: ../services/auto-healing-service
    image: ghcr.io/dalychrayta/bct-auto-healing-service:latest
    container_name: bct-auto-healing-service
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      ORACLE_HOST: oracle
      HEALING_DB_PASSWORD: ${HEALING_DB_PASSWORD}
      EUREKA_HOST: eureka-server
      # Ce service vérifie les jetons lui-même (journal d'audit non falsifiable).
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/bct
      KEYCLOAK_JWKS_URI: http://keycloak:8180/realms/bct/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Cible réelle : le SEUL conteneur que ce service a le droit de
      # redémarrer, et le SEUL dossier où il a le droit de supprimer.
      REAL_TARGET_CONTAINER: bct-platformeback
      REAL_TARGET_LOG_DIR: /target-logs
      JAVA_TOOL_OPTIONS: "-Xmx250m"
    volumes:
      # Socket Docker : permet de redémarrer le conteneur cible. Attention,
      # c'est un privilège fort (accès à tous les conteneurs de la machine) —
      # la restriction vient du code, qui ne nomme jamais qu'un seul conteneur.
      - /var/run/docker.sock:/var/run/docker.sock
      # Logs de la cible, en lecture/écriture pour pouvoir les nettoyer.
      - platformeback-logs:/target-logs
    mem_limit: 400m
    ports:
      - "8084:8084"

  prediction-engine:
    build: ../services/prediction-engine
    image: ghcr.io/dalychrayta/bct-prediction-engine:latest
    container_name: bct-prediction-engine
    mem_limit: 400m
    ports:
      - "8000:8000"

  frontend:
    build: ../frontend/bct-dashboard
    image: ghcr.io/dalychrayta/bct-frontend:latest
    container_name: bct-frontend
    depends_on:
      - api-gateway
    mem_limit: 100m
    ports:
      - "4200:80"

  # ---------------------------------------------------------------------
  # Cible réelle surveillée (srv-002) : PlatformeBack, un projet EXTERNE
  # à ce dépôt, conteneurisé ici pour que le service d'auto-remédiation
  # puisse réellement agir dessus (un conteneur est isolé de la machine
  # hôte : il ne pourrait pas redémarrer un processus Windows).
  # Chemin du projet configurable via PLATFORMEBACK_PATH dans .env.
  # ---------------------------------------------------------------------
  platformeback-mysql:
    image: mysql:8.0
    container_name: bct-platformeback-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${PLATFORMEBACK_DB_PASSWORD}
      MYSQL_DATABASE: platforme
    volumes:
      - platformeback-mysql-data:/var/lib/mysql
    mem_limit: 500m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${PLATFORMEBACK_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  platformeback:
    build: ${PLATFORMEBACK_PATH:-../../../PlatformeBack}
    image: bct/platformeback:latest
    container_name: bct-platformeback
    depends_on:
      platformeback-mysql:
        condition: service_healthy
    environment:
      # sslMode=REQUIRED : MySQL 8 authentifie avec caching_sha2_password, qui
      # exige un canal chiffré. On chiffre la liaison plutôt que d'autoriser
      # allowPublicKeyRetrieval, qui ferait transiter le mot de passe en clair.
      SPRING_DATASOURCE_URL: jdbc:mysql://platformeback-mysql:3306/platforme?serverTimezone=UTC&sslMode=REQUIRED
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${PLATFORMEBACK_DB_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx300m"
    volumes:
      # Logs partagés avec auto-healing-service, qui vient y supprimer
      # les archives trop anciennes (action FREE_DISK_SPACE).
      - platformeback-logs:/app/logs
    mem_limit: 450m
    ports:
      - "8085:8085"

volumes:
  oracle-data:
  grafana-data:
  keycloak-data:
  platformeback-mysql-data:
  platformeback-logs:
